###############################################
# SERVER 1 — NINJA SERVER
###############################################

server {
	listen 127.0.0.1:8084; #testando o corte de comentarios
	server_name ninjas-server; root ./data/ninjas_server;	index index.html;

	client_max_body_size 5000000;

	error_page 403 /errors/403.html;	error_page 404 /errors/404.html;	error_page 500 /errors/500.html;

	location / {
		methods GET;
	}

	location /fast {
		return 302 /silent;
	}

	location /silent {
		cgi .py /usr/bin/python3;
		root ./data/ninjas_server/cgi;
		index silent.py;
		methods GET POST;
	}

	location /deadly {
		# como eu naoo tenho outra extensao, por enquanto eu deixei o .py
		cgi .bash /usr/bin/bash;
		root ./data/ninjas_server/cgi;
		index deadly.bash;
		methods GET POST;
	}

	location /forbidden {
		return 403;
	}
}


