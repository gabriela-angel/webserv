###############################################
# SERVER 1 — NINJA SERVER
###############################################

server {
	listen 127.0.0.1:8084; #testando o corte de comentarios
	server_name ninjas-server;

	root ./data/ninjas_server;
	index index.html;

	client_max_body_size 5000000;

	error_page 403 /errors/403.html;
	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;

	location / {
		methods GET;
	}

	location /fast {
		return 302 /silent;
	}

	location /silent {
		cgi .py /usr/bin/python3;
		root ./data/ninjas_server/cgi;
		index silent.py;
		methods GET POST;
	}

	location /deadly {
		cgi .bash /usr/bin/bash;
		root ./data/ninjas_server/cgi;
		index deadly.bash;
		methods GET POST;
	}

	location /forbidden {
		return 403;
	}

	location /test/test2/comoassim {
		return 200 "ok";
	}
}



###############################################
# SERVER 2 — 42SP SERVER
###############################################

server {
	listen 127.0.0.1:8085;
	server_name 42sp;

	root ./data/42sp;
	index index.html;

	client_max_body_size 20000000;

	error_page 400 /errors/400.html;
	error_page 403 /errors/403.html;
	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;

	location / {
		methods GET;
	}

	location /cadet {
		root ./data/42sp/cadet;
		methods GET POST;
		upload ./data/42sp/cadets/uploads;
		cgi .py /usr/bin/python3;
	}

	location /cadets_uploads {
		root ./data/42sp/cadets/uploads;
		autoindex on;
		methods GET;
	}

	location /cadets_list {
		cgi .py /usr/bin/python3;
		root ./data/42sp/cgi;
		index cadet_list.py;
		methods GET DELETE;
	}

	location /cgi {
		cgi .py /usr/bin/python3;
		root ./data/42sp/cgi;
		methods GET POST DELETE;
	}
}
